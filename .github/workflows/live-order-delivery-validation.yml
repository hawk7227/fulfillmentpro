name: Live Order Delivery Validation

on:
  pull_request:
    paths:
      - 'bridge_boot.py'
      - 'webhook_autoregistration.py'
      - 'notification_extension.py'
      - 'static/js/fulfillment-notifications.js'
      - 'static/js/desktop-operations-nav.js'
      - 'static/css/fulfillment-notifications-live.css'
      - '.github/workflows/live-order-delivery-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile Python modules
        run: python -m py_compile backend.py live_bridge.py bridge_boot.py notification_extension.py webhook_autoregistration.py
      - name: Validate browser JavaScript
        run: |
          node --check static/js/fulfillment-notifications.js
          node --check static/js/desktop-operations-nav.js
