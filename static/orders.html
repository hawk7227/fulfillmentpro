<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All Orders · FulfillmentPro</title><style>
:root{color-scheme:dark;--bg:#04101d;--panel:#081a2c;--panel2:#0b223a;--line:#173c61;--text:#f5f8fc;--muted:#8da3bc;--blue:#328cff;--green:#2bdc87;--orange:#ffae2c;--red:#ff5e62}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:radial-gradient(circle at 88% 0,rgba(45,132,255,.13),transparent 35%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{padding:0 0 calc(76px + env(safe-area-inset-bottom))}
button,input{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:11px;min-height:70px;padding:10px 14px;background:rgba(4,15,27,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(65,133,201,.2)}
.back{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid #1a4169;background:#0a1d31;color:#a8c9ee;text-decoration:none;font-size:1.25rem}
.brand{min-width:0}.brand b{display:block;font-size:1rem}.brand small{display:block;color:var(--muted);font-size:.68rem;margin-top:2px}
.refresh{margin-left:auto;border:1px solid #2866a4;border-radius:11px;background:#0f3b6b;color:#d8ebff;padding:10px 12px;font-weight:700;font-size:.74rem}
main{padding:14px}
.hero{margin-bottom:14px}.hero h1{margin:0;font-size:1.5rem;letter-spacing:-.03em}.hero p{margin:6px 0 0;color:var(--muted);font-size:.82rem;line-height:1.4}
.summary{display:flex;gap:8px;overflow:auto;margin:0 -14px 14px;padding:0 14px;scrollbar-width:none}.summary::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:8px 10px;border:1px solid var(--line);border-radius:999px;background:#081c31;color:#aac0d7;font-size:.68rem}.pill strong{color:#fff}
.list{display:grid;gap:10px}
.card{border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#0a2037,#061522);overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:13px;border-bottom:1px solid rgba(29,66,103,.65)}
.card-head b{font-size:.88rem}.card-head small{display:block;color:var(--muted);font-size:.65rem;margin-top:4px}
.amount{font-size:.8rem;font-weight:750}
.items{padding:4px 12px 8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid rgba(29,62,94,.62)}.item:last-child{border-bottom:0}
.item b{display:block;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.item small{display:block;color:var(--muted);font-size:.62rem;margin-top:3px}
.badge{align-self:center;padding:4px 7px;border-radius:999px;background:#123c2d;color:var(--green);font-size:.58rem;font-weight:750}.badge.wait{background:#3a2b0d;color:var(--orange)}.badge.active{background:#0e3764;color:#58a9ff}.badge.error{background:#431d22;color:#ff8588}
.empty{padding:38px 18px;text-align:center;border:1px dashed #1d466e;border-radius:15px;background:rgba(7,25,43,.55)}.empty b{display:block;font-size:1rem}.empty p{margin:7px 0 0;color:var(--muted);font-size:.75rem;line-height:1.45}
.notice{margin-bottom:12px;padding:11px 12px;border:1px solid #22486d;border-radius:12px;background:#091d32;color:#9db4ca;font-size:.7rem;line-height:1.4}.notice strong{color:#fff}
.search{width:100%;height:42px;margin-bottom:12px;padding:0 12px;border:1px solid #1a4066;border-radius:12px;background:#071827;color:#fff;outline:none}.search:focus{border-color:#328cff}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);min-height:64px;padding:5px 8px calc(5px + env(safe-area-inset-bottom));background:rgba(4,16,29,.97);backdrop-filter:blur(18px);border-top:1px solid rgba(51,105,160,.3)}
.bottom a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#7f95ae;text-decoration:none;font-size:.59rem}.bottom a b{font-size:1.02rem}.bottom a.active{color:#4d9fff}
.modal{display:none;position:fixed;z-index:60;inset:0;background:rgba(0,0,0,.75);padding:18px;align-items:center;justify-content:center}.modal.open{display:flex}.modal-box{width:min(100%,420px);padding:20px;border:1px solid #23507c;border-radius:17px;background:#0b2037}.modal-box h2{margin:0 0 8px}.modal-box p{color:var(--muted);font-size:.76rem}.modal-box input{width:100%;height:45px;margin:10px 0;padding:0 12px;border:1px solid #28659f;border-radius:11px;background:#061522;color:#fff}.modal-box button{width:100%;height:44px;border:0;border-radius:11px;background:#2c88ff;color:#fff;font-weight:750}.error{min-height:20px;color:#ff8386;font-size:.68rem}
@media(min-width:768px){main{max-width:900px;margin:auto}.bottom{max-width:900px;left:50%;transform:translateX(-50%);border-left:1px solid #173c61;border-right:1px solid #173c61}}
</style></head>
<body>
<header class="top"><a class="back" href="/">‹</a><div class="brand"><b>All Orders</b><small>FulfillmentPro</small></div><button id="refresh" class="refresh">Refresh</button></header>
<main><section class="hero"><h1>All Orders</h1><p>Every Shopify order imported into FulfillmentPro.</p></section>
<input id="search" class="search" placeholder="Search order number, customer, or tracking">
<div class="summary"><span class="pill"><strong id="orderCount">0</strong> total orders</span></div>
<section id="ordersList" class="list"><div class="empty"><b>Loading orders…</b></div></section>
</main>

<nav class="bottom">
  <a href="/" class=""><b>⌂</b><span>Home</span></a>
  <a href="/orders.html" class="active"><b>☷</b><span>Orders</span></a>
  <a href="/queue.html" class=""><b>▣</b><span>Queue</span></a>
  <a href="/mapping.html" class=""><b>!</b><span>Mapping</span></a>
</nav>

<div id="authModal" class="modal">
  <div class="modal-box">
    <h2>Owner access</h2>
    <p>Enter the same dashboard token used on the Home page.</p>
    <form id="authForm">
      <input id="tokenInput" type="password" autocomplete="current-password" required placeholder="Dashboard token">
      <div id="authError" class="error"></div>
      <button type="submit">Open page</button>
    </form>
  </div>
</div>

<script>
const TOKEN_KEY='fulfillmentpro.dashboard.token';
let token=sessionStorage.getItem(TOKEN_KEY)||'';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function headers(){return {'Authorization':'Bearer '+token,'Content-Type':'application/json'}}
async function api(path,options={}){
  const response=await fetch(path,{...options,headers:{...headers(),...(options.headers||{})}});
  const data=await response.json().catch(()=>({}));
  if(response.status===401){showAuth();throw new Error('Owner authentication required')}
  if(!response.ok)throw new Error(data.error||'Request failed');
  return data;
}
function showAuth(message=''){
  $('authModal').classList.add('open');
  $('authError').textContent=message;
  setTimeout(()=>$('tokenInput').focus(),0);
}
function hideAuth(){$('authModal').classList.remove('open')}
$('authForm').addEventListener('submit',async event=>{
  event.preventDefault();
  token=$('tokenInput').value.trim();
  try{
    await api('/api/auth/check',{method:'POST'});
    sessionStorage.setItem(TOKEN_KEY,token);
    hideAuth();
    loadPage();
  }catch(error){showAuth(error.message)}
});
if(!token)showAuth();


let searchTimer;
function money(value,currency='USD'){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:currency||'USD'}).format(Number(value||0))}catch{return '$'+Number(value||0).toFixed(2)}}
function dateText(value){const date=new Date(value);return Number.isNaN(date.valueOf())?'—':date.toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'})}
async function loadPage(){
  const search=$('search').value.trim();
  try{
    const data=await api('/api/orders?per_page=100&search='+encodeURIComponent(search));
    $('orderCount').textContent=data.total||0;
    if(!(data.orders||[]).length){
      $('ordersList').innerHTML='<div class="empty"><b>No orders found</b><p>Try another search or sync Shopify from Home.</p></div>';
      return;
    }
    $('ordersList').innerHTML=data.orders.map(order=>`<article class="card">
      <div class="card-head"><div><b>#${esc(order.shopify_order_number||order.id)} · ${esc(order.customer_name||'Customer')}</b><small>${dateText(order.created_at)} · ${order.item_count||0} items</small></div><span class="amount">${money(order.current_total_price||order.total_price,order.currency)}</span></div>
      <div class="items"><div class="item"><div><b>${esc(order.financial_status||'Payment unknown')}</b><small>Payment status</small></div><span class="badge">${esc(order.fulfillment_status||'Unfulfilled')}</span></div></div>
    </article>`).join('');
  }catch(error){$('ordersList').innerHTML=`<div class="empty"><b>Unable to load orders</b><p>${esc(error.message)}</p></div>`}
}
$('search').oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadPage,300)};

$('refresh').onclick=loadPage;
if(token)loadPage();
</script></body></html>
